name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  # --------------------------------------------------------------------------
  # Svelte SPA: typecheck + build. The dist is handed to the Go job because
  # cmd/chronicle embeds web/dist.
  # --------------------------------------------------------------------------
  web:
    name: web (pnpm check + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # web/package.json has no `packageManager` field, so the version is pinned
      # here. If that field is added later, remove `version:` (the action
      # errors when both are set).
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: pnpm check
        run: |
          if node -e "process.exit(require('./package.json').scripts?.check ? 0 : 1)"; then
            pnpm check
          else
            echo "no 'check' script; skipping"
          fi

      - name: pnpm test
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            pnpm test
          else
            echo "no 'test' script; skipping"
          fi

      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 3
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Go: build, vet, lint, test, content validation. The store integration
  # tests (each in a throwaway schema) need DATABASE_URL; they end with the
  # progress check, so CI fails when a projection drifts from its sources
  # (docs/10 decision E3).
  # --------------------------------------------------------------------------
  go:
    name: go (build, vet, lint, test)
    runs-on: ubuntu-latest
    needs: web
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ironman
          POSTGRES_PASSWORD: ironman
          POSTGRES_DB: ironman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ironman -d ironman_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go mod download
      - run: go build ./...
      - run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          # Go cache is already handled by setup-go.
          skip-cache: false

      - name: go test (race needs cgo; store integration tests on postgres 17)
        run: go test -race -count=1 ./...
        env:
          CGO_ENABLED: "1"
          DATABASE_URL: postgres://ironman:ironman@localhost:5432/ironman_test?sslmode=disable

      - name: Validate content
        run: go run ./cmd/chronicle content validate

  # --------------------------------------------------------------------------
  # Migrations: goose up / down / up against a real Postgres 17.
  # --------------------------------------------------------------------------
  migrations:
    name: migrations (goose on postgres 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ironman
          POSTGRES_PASSWORD: ironman
          POSTGRES_DB: ironman_planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ironman -d ironman_planner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://ironman:ironman@localhost:5432/ironman_planner?sslmode=disable
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://ironman:ironman@localhost:5432/ironman_planner?sslmode=disable
      GOOSE_MIGRATION_DIR: db/migrations
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: goose up
        run: goose up

      - name: goose status
        run: goose status

      - name: goose down-to 0 and up again (Down sections must work)
        run: |
          goose down-to 0
          goose up

      - name: sqlc vet (queries parse against the schema)
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@latest vet

  # --------------------------------------------------------------------------
  # Nix and microbot/: the flake's chronicle package (what nix-config installs;
  # catches a stale vendorHash) and the Microbot plugins, compiled and tested
  # against the pinned client jar of the microbot dev shell.
  # --------------------------------------------------------------------------
  nix:
    name: nix (chronicle package, microbot plugins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: nix build .#chronicle
        run: nix build --print-build-logs .#chronicle && ./result/bin/chronicle --version
      - name: gradle test pluginJars
        run: nix develop .#microbot -c gradle -p microbot --console=plain test pluginJars

  # --------------------------------------------------------------------------
  # Kubernetes manifests of the saradomin deploy (deploy/k8s): they must render.
  # --------------------------------------------------------------------------
  manifests:
    name: k8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: kubectl kustomize deploy/k8s/overlays/saradomin > /dev/null

  # --------------------------------------------------------------------------
  # Images and deploy, on main only: the chronicle image (server and embedded
  # migrations) goes to GHCR under the commit's sha, and the saradomin overlay
  # is pointed at it. Argo CD on saradomin follows that overlay on main, so the
  # bump commit is the deploy (docs/07 section 3.3). The chronicle-worker image
  # (chronicle-worker-base plus the same binary) goes out under the same sha and
  # the overlay's WORKER_IMAGE follows it (docs/11 sections 7.2 and 13.4); the
  # base is built only when GHCR lacks the tag of its inputs.
  # --------------------------------------------------------------------------
  docker:
    name: image + deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, web, migrations, manifests, nix]
    # One deploy at a time: two runs bumping the same lines race, and the older could win.
    concurrency:
      group: deploy-saradomin
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # the deploy step compares this commit with main's history
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR wants lower-case names; the owner has upper-case letters.
      - name: Image names
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chronicle" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chronicle-worker" >> "$GITHUB_ENV"
          echo "WORKER_BASE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chronicle-worker-base" >> "$GITHUB_ENV"

      # chronicle-worker-base is tagged by the last commit that changed its
      # inputs (microbot/, nix/, its Dockerfile and script): most runs find it
      # in GHCR and skip Nix and gradle. Built before setup-buildx, whose
      # builder could not see the runtime image that `docker load` puts in the
      # local daemon.
      - name: Worker base tag
        id: base
        run: |
          ref="${WORKER_BASE}:$(deploy/worker/build-base.sh --tag)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$ref" > /dev/null 2>&1; then
            echo "$ref already in GHCR"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: cachix/install-nix-action@v31
        if: steps.base.outputs.build == 'true'

      - name: Build and push chronicle-worker-base
        if: steps.base.outputs.build == 'true'
        env:
          REF: ${{ steps.base.outputs.ref }}
        run: |
          built="$(deploy/worker/build-base.sh "$WORKER_BASE" | tail -n1)"
          [ "$built" = "$REF" ] || { echo "::error::built $built, expected $REF"; exit 1; }
          docker push "$REF"
          echo "### chronicle-worker-base" >> "$GITHUB_STEP_SUMMARY"
          echo "built and pushed \`$REF\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same web and go stages as the server's image: on this builder they are
      # cache hits. Its own GHA cache scope, so the two builds do not evict
      # each other's cache.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/worker/Dockerfile
          push: true
          tags: ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          build-args: |
            BASE=${{ steps.base.outputs.ref }}
            VERSION=${{ github.sha }}
          cache-from: |
            type=gha
            type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      # A push made with GITHUB_TOKEN starts no other run. If main already has
      # newer commits than this run's (other than deploy bumps), their run
      # deploys and this one stands down, so an older image never replaces a
      # newer one.
      - name: Deploy to saradomin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          overlay=deploy/k8s/overlays/saradomin/kustomization.yaml
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            if git log --format=%s "${GITHUB_SHA}..origin/main" | grep -qv '^deploy: saradomin roda '; then
              echo "main moved past ${GITHUB_SHA::7}; the newer run deploys"
              exit 0
            fi
            git checkout --quiet -B deploy origin/main
            sed -i "s|^    newTag: .*|    newTag: \"${GITHUB_SHA}\"|" "$overlay"
            sed -i "s|^      - WORKER_IMAGE=.*|      - WORKER_IMAGE=${WORKER_IMAGE}:${GITHUB_SHA}|" "$overlay"
            git diff --quiet && exit 0
            git commit --quiet -am "deploy: saradomin roda ${GITHUB_SHA::7}"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
