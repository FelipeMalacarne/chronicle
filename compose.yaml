# Local stack on zaros: Postgres 17 + migrations + the app image built from this repo.
#
#   cp .env.example .env              # set POSTGRES_PASSWORD
#   just up                           # build from HEAD, migrate, start
#   open http://localhost:8080        # first access at /setup: name, detected mode, route
#
# - `migrate` applies db/migrations with goose and exits; `app` starts only after it succeeded
#   (the server never migrates: only `ironman serve` opens the database, CLAUDE.md rule 1).
# - The app listens on 127.0.0.1 only: AUTH_MODE=dev has no login, so whoever reaches the port
#   reads and writes progress. Set IRONMAN_BIND=0.0.0.0 in .env only on purpose (phone, Tailscale).
# - The images are built by `just up` from the committed HEAD (git archive), never from the
#   working tree: the entity catalogs are embedded in the binary and must match the guides and
#   annotations, and the extraction keeps unfinished batches in the working tree. A newly
#   extracted section shows up after it is committed and `just up` runs again.
# - Postgres is published on 127.0.0.1:${POSTGRES_PORT} only, so `just dev` (air + Vite on the host)
#   uses this same database; `just dev` stops the `app` container to free port 8080 and `just up`
#   brings it back. `just stack-psql`, `just db-backup` and the stack-account recipes still go
#   through `docker compose exec`.
#
# Variables come from .env (compose reads it for interpolation, the app gets it through
# env_file). DATABASE_URL is composed here with host `postgres`, so the same .env keeps
# working for host dev (`just dev`, localhost).
#
# saradomin does not use this file: it runs the same images on k3s from deploy/k8s, with
# AUTH_MODE=oidc (docs/07 section 3.3).

name: ironman-planner

x-database-url: &database-url postgres://${POSTGRES_USER:-ironman}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ironman_planner}?sslmode=disable

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ironman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ironman_planner}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  migrate:
    image: ironman-planner-migrate:stack
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOOSE_DBSTRING: *database-url

  app:
    image: ironman-planner:stack
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false   # compose still interpolates ${...} from .env when present
    environment:
      IRONMAN_ADDR: ":8080"
      CONTENT_DIR: /app/content
      DATABASE_URL: *database-url
    ports:
      - "${IRONMAN_BIND:-127.0.0.1}:${IRONMAN_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/ironman", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
