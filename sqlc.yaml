# sqlc v2 config. Generate with `just sqlc` (runs sqlc via `go run`).
# Schema comes from the goose migrations (sqlc ignores the `-- +goose Down` part).
version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries"
    gen:
      go:
        package: "db"
        out: "internal/store/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_result_struct_pointers: false
        emit_enum_valid_method: true
        json_tags_case_style: "snake"
        overrides:
          # jsonb columns come out as []byte by default; json.RawMessage is
          # friendlier for handlers that pass them straight through.
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type: "encoding/json.RawMessage"
