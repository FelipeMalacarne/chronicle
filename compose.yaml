# Local stack on zaros: Postgres 17 + migrations + the app image built from this repo.
#
#   cp .env.example .env              # set POSTGRES_PASSWORD
#   just up                           # build, migrate, start
#   just stack-account-create "<RSN>" # once: the account (id acc_<rsn>)
#   open http://localhost:8080/?account=acc_<rsn>
#
# - `migrate` applies db/migrations with goose and exits; `app` starts only after it succeeded
#   (the server never migrates: only `ironman serve` opens the database, CLAUDE.md rule 1).
# - The app listens on 127.0.0.1 only: AUTH_MODE=dev has no login, so whoever reaches the port
#   reads and writes progress. Set IRONMAN_BIND=0.0.0.0 in .env only on purpose (phone, Tailscale).
# - content/ is mounted read-only: a newly extracted section shows up after `just restart`.
# - Postgres has no host port (it would clash with compose.dev.yaml); use `just stack-psql`,
#   `just db-backup` and the stack-account recipes, which go through `docker compose exec`.
#
# Variables come from .env (compose reads it for interpolation, the app gets it through
# env_file). DATABASE_URL is composed here with host `postgres`, so the same .env keeps
# working for host dev against compose.dev.yaml (localhost).
#
# On saradomin (existing Postgres + Zitadel) only the `app` service would be used, with
# AUTH_MODE=oidc; that needs session auth first (docs/04 section 9, item 11).

name: ironman-planner

x-database-url: &database-url postgres://${POSTGRES_USER:-ironman}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ironman_planner}?sslmode=disable

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ironman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ironman_planner}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  migrate:
    build:
      context: .
      target: migrate
    image: ironman-planner-migrate:${VERSION:-dev}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOOSE_DBSTRING: *database-url

  app:
    build:
      context: .
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
    image: ironman-planner:${VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false   # compose still interpolates ${...} from .env when present
    environment:
      IRONMAN_ADDR: ":8080"
      CONTENT_DIR: /app/content
      DATABASE_URL: *database-url
    ports:
      - "${IRONMAN_BIND:-127.0.0.1}:${IRONMAN_PORT:-8080}:8080"
    volumes:
      - ./content:/app/content:ro
    healthcheck:
      test: ["CMD", "/ironman", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
