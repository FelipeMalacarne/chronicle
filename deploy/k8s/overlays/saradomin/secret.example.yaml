# Reference only: NOT part of the kustomization and NEVER committed with real values.
# The real Secret lives in gielinor (clusters/saradomin/apps/chronicle/secrets.yaml), encrypted
# with SOPS. Keep the keys here in step with it (docs/07 section 3.3).
apiVersion: v1
kind: Secret
metadata:
  name: chronicle-secrets
type: Opaque
stringData:
  DATABASE_URL: postgres://chronicle:CHANGE_ME@postgres-main-rw.databases.svc:5432/chronicle?sslmode=require
  SESSION_SECRET: ""            # openssl rand -hex 32
  OIDC_CLIENT_ID: ""            # Zitadel: project Chronicle, Web app (PKCE)
  OIDC_NATIVE_CLIENT_ID: ""     # Zitadel: project Chronicle, Native app (device code, JWT)
  OIDC_PROJECT_ID: ""           # Zitadel: project Chronicle id
  OIDC_ALLOWED_SUBJECTS: ""     # the owner's user id; with OIDC_REQUIRED_ROLE both are required
