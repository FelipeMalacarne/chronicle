name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  # --------------------------------------------------------------------------
  # Svelte SPA: typecheck + build. The dist is handed to the Go job because
  # cmd/ironman embeds web/dist.
  # --------------------------------------------------------------------------
  web:
    name: web (pnpm check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # web/package.json has no `packageManager` field, so the version is pinned
      # here. If that field is added later, remove `version:` (the action
      # errors when both are set).
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: pnpm check
        run: |
          if node -e "process.exit(require('./package.json').scripts?.check ? 0 : 1)"; then
            pnpm check
          else
            echo "no 'check' script; skipping"
          fi

      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 3
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Go: build, vet, lint, test, content validation.
  # --------------------------------------------------------------------------
  go:
    name: go (build, vet, lint, test)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go mod download
      - run: go build ./...
      - run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          # Go cache is already handled by setup-go.
          skip-cache: false

      - name: go test (race needs cgo)
        run: go test -race -count=1 ./...
        env:
          CGO_ENABLED: "1"

      - name: Validate content
        run: go run ./cmd/ironman content validate

  # --------------------------------------------------------------------------
  # Migrations: goose up / down / up against a real Postgres 17.
  # --------------------------------------------------------------------------
  migrations:
    name: migrations (goose on postgres 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ironman
          POSTGRES_PASSWORD: ironman
          POSTGRES_DB: ironman_planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ironman -d ironman_planner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://ironman:ironman@localhost:5432/ironman_planner?sslmode=disable
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://ironman:ironman@localhost:5432/ironman_planner?sslmode=disable
      GOOSE_MIGRATION_DIR: db/migrations
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: goose up
        run: goose up

      - name: goose status
        run: goose status

      - name: goose down-to 0 and up again (Down sections must work)
        run: |
          goose down-to 0
          goose up

      - name: sqlc vet (queries parse against the schema)
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@latest vet

  # --------------------------------------------------------------------------
  # Docker image: build only, on main. No push (the registry on saradomin is
  # wired later).
  # --------------------------------------------------------------------------
  docker:
    name: docker build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, web, migrations]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ironman-planner:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
