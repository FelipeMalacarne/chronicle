# Dev stack: only Postgres. The app runs on the host (`just dev` -> air / go run)
# and the SPA runs under Vite (`just web-dev`).
#
#   just db-up      # docker compose -f compose.dev.yaml up -d
#   just db-down
#
# DATABASE_URL in .env must point at localhost:${POSTGRES_PORT} (see .env.example).

name: ironman-planner-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ironman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ironman}
      POSTGRES_DB: ${POSTGRES_DB:-ironman_planner}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  pgdata-dev:
