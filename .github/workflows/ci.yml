name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  # --------------------------------------------------------------------------
  # Svelte SPA: typecheck + build. The dist is handed to the Go job because
  # cmd/ironman embeds web/dist.
  # --------------------------------------------------------------------------
  web:
    name: web (pnpm check + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # web/package.json has no `packageManager` field, so the version is pinned
      # here. If that field is added later, remove `version:` (the action
      # errors when both are set).
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: pnpm check
        run: |
          if node -e "process.exit(require('./package.json').scripts?.check ? 0 : 1)"; then
            pnpm check
          else
            echo "no 'check' script; skipping"
          fi

      - name: pnpm test
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            pnpm test
          else
            echo "no 'test' script; skipping"
          fi

      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 3
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Go: build, vet, lint, test, content validation. The store integration
  # tests (each in a throwaway schema) need DATABASE_URL; they end with the
  # progress check, so CI fails when a projection drifts from its sources
  # (docs/10 decision E3).
  # --------------------------------------------------------------------------
  go:
    name: go (build, vet, lint, test)
    runs-on: ubuntu-latest
    needs: web
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ironman
          POSTGRES_PASSWORD: ironman
          POSTGRES_DB: ironman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ironman -d ironman_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go mod download
      - run: go build ./...
      - run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          # Go cache is already handled by setup-go.
          skip-cache: false

      - name: go test (race needs cgo; store integration tests on postgres 17)
        run: go test -race -count=1 ./...
        env:
          CGO_ENABLED: "1"
          DATABASE_URL: postgres://ironman:ironman@localhost:5432/ironman_test?sslmode=disable

      - name: Validate content
        run: go run ./cmd/chronicle content validate

  # --------------------------------------------------------------------------
  # Migrations: goose up / down / up against a real Postgres 17.
  # --------------------------------------------------------------------------
  migrations:
    name: migrations (goose on postgres 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ironman
          POSTGRES_PASSWORD: ironman
          POSTGRES_DB: ironman_planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ironman -d ironman_planner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://ironman:ironman@localhost:5432/ironman_planner?sslmode=disable
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://ironman:ironman@localhost:5432/ironman_planner?sslmode=disable
      GOOSE_MIGRATION_DIR: db/migrations
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: goose up
        run: goose up

      - name: goose status
        run: goose status

      - name: goose down-to 0 and up again (Down sections must work)
        run: |
          goose down-to 0
          goose up

      - name: sqlc vet (queries parse against the schema)
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@latest vet

  # --------------------------------------------------------------------------
  # Kubernetes manifests of the saradomin deploy (deploy/k8s): they must render.
  # --------------------------------------------------------------------------
  manifests:
    name: k8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: kubectl kustomize deploy/k8s/overlays/saradomin > /dev/null

  # --------------------------------------------------------------------------
  # Images and deploy, on main only: the chronicle image (server and embedded
  # migrations) goes to GHCR under the commit's sha, and the saradomin overlay
  # is pointed at it. Argo CD on saradomin follows that overlay on main, so the
  # bump commit is the deploy (docs/07 section 3.3). When deploy/worker/base.lock
  # pins a microbot-worker-base, the chronicle-worker image (that base plus the
  # same binary) goes out under the same sha and the overlay's WORKER_IMAGE
  # follows it (docs/11 sections 7.2 and 13.4).
  # --------------------------------------------------------------------------
  docker:
    name: image + deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, web, migrations, manifests]
    # One deploy at a time: two runs bumping the same lines race, and the older could win.
    concurrency:
      group: deploy-saradomin
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # the deploy step compares this commit with main's history
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR wants lower-case names; the owner has upper-case letters.
      - name: Image names
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chronicle" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chronicle-worker" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The worker image is built only once `just worker-base-bump <tag>` has
      # pinned a base; until then the run publishes the server alone.
      - name: Worker base
        id: worker
        run: |
          base="$(tr -d '[:space:]' < deploy/worker/base.lock)"
          if [ -z "$base" ]; then
            echo "::warning title=chronicle-worker not published::deploy/worker/base.lock is empty; pin a microbot-worker-base with just worker-base-bump <tag>"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$base" =~ ^ghcr\.io/felipemalacarne/microbot-worker-base@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error file=deploy/worker/base.lock::expected ghcr.io/felipemalacarne/microbot-worker-base@sha256:<digest>, got '${base}'"
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      # Same web and go stages as the server's image: on this builder they are
      # cache hits. Its own GHA cache scope, so the two builds do not evict
      # each other's cache.
      - uses: docker/build-push-action@v6
        if: steps.worker.outputs.publish == 'true'
        with:
          context: .
          file: deploy/worker/Dockerfile
          push: true
          tags: ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          build-args: |
            BASE=${{ steps.worker.outputs.base }}
            VERSION=${{ github.sha }}
          cache-from: |
            type=gha
            type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      # A push made with GITHUB_TOKEN starts no other run. If main already has
      # newer commits than this run's (other than deploy bumps), their run
      # deploys and this one stands down, so an older image never replaces a
      # newer one.
      - name: Deploy to saradomin
        env:
          WORKER_PUBLISHED: ${{ steps.worker.outputs.publish }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          overlay=deploy/k8s/overlays/saradomin/kustomization.yaml
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            if git log --format=%s "${GITHUB_SHA}..origin/main" | grep -qv '^deploy: saradomin roda '; then
              echo "main moved past ${GITHUB_SHA::7}; the newer run deploys"
              exit 0
            fi
            git checkout --quiet -B deploy origin/main
            sed -i "s|^    newTag: .*|    newTag: \"${GITHUB_SHA}\"|" "$overlay"
            if [ "$WORKER_PUBLISHED" = true ]; then
              sed -i "s|^      - WORKER_IMAGE=.*|      - WORKER_IMAGE=${WORKER_IMAGE}:${GITHUB_SHA}|" "$overlay"
            fi
            git diff --quiet && exit 0
            git commit --quiet -am "deploy: saradomin roda ${GITHUB_SHA::7}"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
