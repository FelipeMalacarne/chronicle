apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: chronicle
# The namespace, the database and the Secret chronicle-secrets belong to the cluster: gielinor creates them, the database `chronicle` on the shared CloudNativePG cluster
# (clusters/saradomin/apps/postgres) and the Secret, encrypted by SOPS, in apps/chronicle.
# This overlay only says how the app runs.
resources:
  - ../../base
  - ingress.yaml
configMapGenerator:
  - name: chronicle-config
    behavior: merge
    literals:
      - AUTH_MODE=oidc
      - OIDC_ISSUER=https://auth.ftm.dev.br
      - PUBLIC_BASE_URL=https://chronicle.saradomin.ftm.dev.br
      - OIDC_REQUIRED_ROLE=owner
      - SYNC_HISCORES_MINUTES=30
      # docs/08: the agent of zaros links with a Zitadel machine user (role microbot:agent);
      # the cockpit needs the role microbot:control. OIDC_PROJECT_ID is in chronicle-secrets.
      - MICROBOT_CONTROL=on
      # docs/11: the Microbot workers (one pod per account), on since 2026-11-12: CHRONICLE_VAULT_KEY is
      # in chronicle-secrets (SOPS, gielinor apps/chronicle/README.md), without which the server refuses
      # to start with WORKERS=on. WORKER_IMAGE below is written by CI with each deploy.
      - WORKERS=on
      # CI sets this to the chronicle-worker image it just pushed (deploy/worker; docs/11 section 7.2).
      - WORKER_IMAGE=ghcr.io/felipemalacarne/chronicle-worker:7835b9448c8272dfdffdef2965e768497e4a1a53
images:
  - name: chronicle
    newName: ghcr.io/felipemalacarne/chronicle
    # CI sets this to the image it just pushed, on every push to main.
    newTag: "7835b9448c8272dfdffdef2965e768497e4a1a53"
