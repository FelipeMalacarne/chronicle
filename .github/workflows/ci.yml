name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # The dev shell pins the client jar the plugins compile against (flake.nix, microbot.json).
      - name: gradle test pluginJars
        run: nix develop -c gradle --console=plain test pluginJars

  # microbot-worker-base (planner docs/11 section 13.4), from main only, and only when something
  # that goes into the image changed.
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed image inputs
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "build=true" >>"$GITHUB_OUTPUT"
            echo "no usable previous commit: building"
            exit 0
          fi
          changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- \
            microbot.json src bin 'flake.*' worker .dockerignore build.gradle settings.gradle lombok.config \
            .github/workflows/ci.yml)"
          echo "$changed"
          if [[ -n "$changed" ]]; then echo "build=true" >>"$GITHUB_OUTPUT"; else echo "build=false" >>"$GITHUB_OUTPUT"; fi
      - uses: cachix/install-nix-action@v31
        if: steps.changed.outputs.build == 'true'
      - uses: docker/login-action@v3
        if: steps.changed.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push microbot-worker-base
        if: steps.changed.outputs.build == 'true'
        run: |
          ref="$(worker/build.sh ghcr.io/felipemalacarne/microbot-worker-base | tail -n1)"
          docker push "$ref" | tee push.log
          digest="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' push.log | tail -n1)"
          [[ -n "$digest" ]] || digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$ref" | sed 's/.*@//')"
          {
            echo "### microbot-worker-base"
            echo
            echo "- tag: \`$ref\`"
            echo "- digest: \`$digest\`"
            echo "- pin in chronicle \`deploy/worker/base.lock\`: \`${ref%:*}@$digest\`"
          } >>"$GITHUB_STEP_SUMMARY"
