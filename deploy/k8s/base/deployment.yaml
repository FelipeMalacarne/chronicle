apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronicle
spec:
  replicas: 1
  # One server per database: the hiscores scheduler and the SSE hub live in the process.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # GHCR images of a private repository.
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: migrate
          image: chronicle-migrate
          args: ["up"]
          env:
            - name: GOOSE_DBSTRING
              valueFrom:
                secretKeyRef:
                  name: chronicle-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: chronicle
          image: chronicle
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: chronicle-config
            - secretRef:
                name: chronicle-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          # /api/version never opens the database: a Postgres outage is not a reason to restart.
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
